name: Sync upstream and publish Docker image

on:
  workflow_dispatch:

  schedule:
    # Chaque lundi à 04:17 UTC
    - cron: "17 4 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stremio-french-stream-docker
  UPSTREAM_REPOSITORY: Nikola17/addon-stremio-fs-public-render
  UPSTREAM_REF: main

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aerya repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream repository
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/upstream"

          git clone \
            --depth 1 \
            --branch "${UPSTREAM_REF}" \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" \
            "$RUNNER_TEMP/upstream"

          cd "$RUNNER_TEMP/upstream"

          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Copy upstream into Aerya repository
        id: sync
        shell: bash
        run: |
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "compose.yml" \
            "$RUNNER_TEMP/upstream/" \
            "./"

          cat > Dockerfile <<'EOF'
          FROM node:22-bookworm-slim

          ENV NODE_ENV=production
          ENV PORT=7000

          WORKDIR /app

          COPY package*.json ./
          RUN npm install --omit=dev

          COPY . .

          EXPOSE 7000

          CMD ["node", "server.js"]
          EOF

          cat > .dockerignore <<'EOF'
          .git
          .github
          node_modules
          npm-debug.log
          compose.yml
          EOF

          echo "${UPSTREAM_SHA}" > .upstream-sha

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changements upstream détectés."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement upstream."
          fi

      - name: Commit and push changes
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Sync upstream ${UPSTREAM_REPOSITORY}@${UPSTREAM_SHORT_SHA}"
          git push

      - name: Prepare Docker image tags
        id: vars
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"

          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:upstream-${UPSTREAM_SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.sync.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.sync.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.sync.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.sync.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Stremio French Stream Docker
            org.opencontainers.image.description=Docker multi-arch image synced from Nikola17/addon-stremio-fs-public-render
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
