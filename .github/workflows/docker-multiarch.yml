name: Build and publish Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stremio-french-stream-docker
  UPSTREAM_REPOSITORY: Nikola17/addon-stremio-fs-public-render
  UPSTREAM_REF: main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: source

      - name: Create Dockerfile
        working-directory: source
        run: |
          cat > Dockerfile <<'EOF'
          FROM node:22-bookworm-slim

          ENV NODE_ENV=production
          ENV PORT=7000

          WORKDIR /app

          COPY package*.json ./
          RUN npm install --omit=dev

          COPY . .

          EXPOSE 7000

          CMD ["node", "server.js"]
          EOF

      - name: Create .dockerignore
        working-directory: source
        run: |
          cat > .dockerignore <<'EOF'
          .git
          .github
          node_modules
          npm-debug.log
          Dockerfile
          .dockerignore
          EOF

      - name: Prepare image tags
        id: vars
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:sha-${SHORT_SHA}"

            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
              echo "${IMAGE}:${GITHUB_REF_NAME}"
              echo "${IMAGE}:${VERSION}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Stremio French Stream Docker
            org.opencontainers.image.description=Docker multi-arch packaging for Nikola17/addon-stremio-fs-public-render
            org.opencontainers.image.source=https://github.com/Aerya/Stremio-French-Stream-Docker
            org.opencontainers.image.url=https://github.com/Aerya/Stremio-French-Stream-Docker
            org.opencontainers.image.documentation=https://github.com/Aerya/Stremio-French-Stream-Docker
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
